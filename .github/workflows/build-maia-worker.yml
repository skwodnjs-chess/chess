name: Build Maia browser worker

on:
  push:
    branches:
      - main
    paths:
      - maia-worker-source.js
      - package.json
      - .github/workflows/build-maia-worker.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Bundle Maia worker
        run: npm run build:maia

      - name: Verify browser bundle
        run: |
          if grep -nE 'esm\.sh|/node/process\.mjs|huggingface\.co' stockfish-worker.js; then
            echo 'Unexpected external/CDN or Node shim reference found in browser worker.' >&2
            exit 1
          fi
          echo 'Browser worker is self-contained with no esm.sh, Hugging Face, or /node/process.mjs reference.'

      - name: Vendor ONNX Runtime WASM
        run: |
          mkdir -p assets/ort
          cp node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.wasm assets/ort/ort-wasm-simd-threaded.wasm

      - name: Commit generated browser assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stockfish-worker.js assets/ort/ort-wasm-simd-threaded.wasm package-lock.json
          if git diff --cached --quiet; then
            echo "Generated assets are already up to date."
            exit 0
          fi
          git commit -m "Bundle Maia browser runtime"
          git push
