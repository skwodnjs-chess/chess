name: One-shot Maia debug migration

on:
  push:
    paths:
      - '.github/workflows/patch-maia-debug.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch app.js
        shell: python
        run: |
          from pathlib import Path

          p = Path('app.js')
          s = p.read_text(encoding='utf-8')

          def rep(old, new, count=1):
              global s
              n = s.count(old)
              if n < count:
                  raise SystemExit(f'Expected at least {count} occurrence(s), found {n}: {old[:100]!r}')
              s = s.replace(old, new, count)

          rep('let games = [makeGameRecord("현재 게임", true, 1000)];', 'let games = [makeGameRecord("현재 게임", true, 2000)];')

          rep(
          '''    this.candidates = new Map();
              this.failed = false;''',
          '''    this.candidates = new Map();
              this.failed = false;
              this.lastElo = 2000;
              this.lastDebug = null;
              this.lastError = null;''')

          rep('new Error("Stockfish unavailable")', 'new Error("Maia unavailable")', 2)

          rep(
          '''      if (line === "readyok") {
                this.readyResolve?.();
                this.readyResolve = null;
                continue;
              }
              if (!this.pending) continue;''',
          '''      if (line === "readyok") {
                this.readyResolve?.();
                this.readyResolve = null;
                continue;
              }
              if (line.startsWith("info string maia-debug ")) {
                try {
                  this.lastDebug = JSON.parse(line.slice("info string maia-debug ".length));
                  if (this.lastDebug.phase === "predict-result") {
                    console.info("[Chess][Maia] inference", this.lastDebug);
                  }
                } catch (error) {
                  console.warn("[Chess][Maia] malformed debug payload", line, error);
                }
                continue;
              }
              if (line.startsWith("info string maia-error ")) {
                this.lastError = line.slice("info string maia-error ".length);
                console.error("[Chess][Maia] engine error:", this.lastError);
                continue;
              }
              if (!this.pending) continue;''')

          old_move = '''    this.candidates.clear();
              const limited = rating >= 1320;
              if (limited) {
                this.worker.postMessage("setoption name UCI_LimitStrength value true");
                this.worker.postMessage(`setoption name UCI_Elo value ${Math.min(3190, Math.max(1320, rating))}`);
                this.worker.postMessage("setoption name MultiPV value 1");
              } else {
                this.worker.postMessage("setoption name UCI_LimitStrength value false");
                this.worker.postMessage("setoption name Skill Level value 0");
                this.worker.postMessage("setoption name MultiPV value 5");
              }
              return new Promise((resolve, reject) => {
                this.pending = { resolve, reject, legalMoves, rating, limited };
                this.worker.postMessage(`position fen ${fen}`);
                this.worker.postMessage("go movetime 350");
              });'''
          new_move = '''    this.candidates.clear();
              const effectiveRating = Math.round(Math.min(3200, Math.max(400, Number.isFinite(rating) ? rating : 2000)));
              this.lastElo = effectiveRating;
              this.lastError = null;
              this.worker.postMessage(`setoption name Elo value ${effectiveRating}`);
              this.worker.postMessage("setoption name Temperature value 0");
              this.worker.postMessage("setoption name TopP value 1");
              this.worker.postMessage("setoption name MultiPV value 5");
              console.info("[Chess][Maia] move request", { elo: effectiveRating, temperature: 0, topP: 1, fen });
              return new Promise((resolve, reject) => {
                this.pending = { resolve, reject, legalMoves, rating: effectiveRating, limited: true };
                this.worker.postMessage(`position fen ${fen}`);
                this.worker.postMessage("go maia");
              });'''
          rep(old_move, new_move)

          rep(
          '''const engine = new StockfishClient();

          function isAtLatestPosition() {''',
          '''const engine = new StockfishClient();

          function getChessDebugState() {
            const record = activeGame();
            return {
              engine: window.__CHESS_ENGINE_INFO__?.engine ?? "Maia3 5M",
              activeGameId,
              aiEnabled: Boolean(record?.aiEnabled),
              selectedElo: record?.rating ?? null,
              workerElo: engine.lastElo,
              temperature: 0,
              topP: 1,
              thinking,
              started,
              playerColor,
              turn: game.turn(),
              fen: game.fen(),
              lastInference: engine.lastDebug,
              lastError: engine.lastError
            };
          }

          window.__CHESS_DEBUG__ = Object.freeze({
            get state() { return getChessDebugState(); },
            getState: getChessDebugState,
            print() {
              const state = getChessDebugState();
              console.log("[Chess][Debug]", state);
              return state;
            }
          });

          function isAtLatestPosition() {''')

          rep(
          '''  let uciMove = null;
            try { uciMove = await engine.move(game.fen(), legalMoves, record.rating); } catch { uciMove = chooseFallbackMove(); }
            if (token !== turnToken || !started || game.isGameOver() || activeGameId !== record.id) return;
            thinking = false;
            if (!uciMove || !legalMoves.includes(uciMove)) uciMove = chooseFallbackMove();
            if (!uciMove) return updateGameOverStatus();''',
          '''  let uciMove = null;
            try {
              uciMove = await engine.move(game.fen(), legalMoves, record.rating);
            } catch (error) {
              thinking = false;
              engine.lastError = error instanceof Error ? error.message : String(error);
              console.error("[Chess][Maia] move failed", error);
              setStatus("Maia 엔진 오류가 발생했습니다. 콘솔의 __CHESS_DEBUG__.print()를 확인하세요.", "idle");
              return;
            }
            if (token !== turnToken || !started || game.isGameOver() || activeGameId !== record.id) return;
            thinking = false;
            if (!uciMove || !legalMoves.includes(uciMove)) {
              engine.lastError = `Invalid Maia move: ${uciMove ?? "null"}`;
              console.error("[Chess][Maia] invalid move", { uciMove, legalMoves, debug: engine.lastDebug });
              setStatus("Maia가 유효하지 않은 수를 반환했습니다. 콘솔 디버그 정보를 확인하세요.", "idle");
              return;
            }''')

          rep('  ratingSelect.value = "1000";\n  ratingCustomInput.value = "1000";', '  ratingSelect.value = "2000";\n  ratingCustomInput.value = "2000";')
          rep('Number.isFinite(rawRating) ? rawRating : 1000', 'Number.isFinite(rawRating) ? rawRating : 2000')

          p.write_text(s, encoding='utf-8')

      - name: Remove one-shot workflow
        run: git rm .github/workflows/patch-maia-debug.yml
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Debug Maia Elo and remove silent fallback"
          git push
