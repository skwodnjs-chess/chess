name: Patch Maia init guard

on:
  push:
    paths:
      - .github/workflows/patch-maia-init-guard.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app.js
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          old = '    await this.readyPromise;\n\n    const effectiveRating = Math.round('
          new = '    await this.readyPromise;\n    if (this.failed || !this.worker) throw new Error(this.lastError || "Maia unavailable");\n\n    const effectiveRating = Math.round('
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Remove one-shot workflow
        run: git rm .github/workflows/patch-maia-init-guard.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Guard Maia initialization failure"
          git push
