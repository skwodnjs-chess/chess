<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="브라우저에서 Maia AI와 플레이하는 체스 게임">
  <title>skwodnjs Chess</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./annotations.css">
</head>
<body>
  <main class="app-shell">
    <aside class="sidebar" aria-label="게임 목록">
      <div class="sidebar-brand">
        <span class="brand-mark" aria-hidden="true"><span class="brand-mark-glyph">♞</span></span>
        <span>Chess</span>
      </div>

      <button id="new-game-button" class="new-game-button" type="button">
        <span class="new-game-icon" aria-hidden="true">＋</span>
        <span>새 게임</span>
      </button>

      <section class="sidebar-section">
        <p class="sidebar-label">게임</p>
        <nav id="game-list" class="game-list" aria-label="게임 목록"></nav>
      </section>

      <div class="sidebar-spacer"></div>
      <button id="admin-button" class="admin-button" type="button" title="관리자 모드">
        <span aria-hidden="true">⌕</span>
        <span>관리자</span>
      </button>
    </aside>

    <section class="workspace" aria-labelledby="page-title">
      <header class="workspace-header">
        <h1 id="page-title">현재 게임</h1>
        <div id="engine-badge" class="engine-badge">AI · Elo 2000</div>
      </header>

      <div class="game-stage">
        <div class="controls" aria-label="게임 설정">
          <button id="color-button" class="button button-secondary" type="button" title="플레이 색상 전환" aria-label="플레이 색상 전환">
            <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18V6M4.5 8.5 7 6l2.5 2.5M17 6v12m-2.5-2.5L17 18l2.5-2.5"/></svg>
          </button>
          <button id="start-button" class="button button-primary" type="button" title="게임 시작" aria-label="게임 시작">
            <svg class="button-icon button-icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10-6.5z"/></svg>
          </button>
          <button id="reset-button" class="button button-ghost" type="button" title="게임 초기화" aria-label="게임 초기화">
            <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 9A8 8 0 1 1 6 17.5M4.5 9V4.5M4.5 9H9"/></svg>
          </button>
        </div>

        <div id="status-row" class="status-row" aria-live="polite">
          <span id="status-dot" class="status-dot"></span>
          <p id="status" class="status"></p>
        </div>

        <div class="board-wrap">
          <div id="board" class="board" role="grid" aria-label="체스판"></div>
          <div id="result-card" class="result-card" aria-live="assertive" aria-hidden="true">
            <strong id="result-title" class="result-title"></strong>
            <span id="result-detail" class="result-detail"></span>
          </div>
        </div>

        <div class="history-controls" aria-label="수 탐색">
          <button id="history-first" class="history-button" type="button" title="처음 수" aria-label="처음 수">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M18 6l-8 6 8 6z"/></svg>
          </button>
          <button id="history-prev" class="history-button" type="button" title="이전 수" aria-label="이전 수">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-8 6 8 6z"/></svg>
          </button>
          <span id="history-position" class="history-position" aria-live="polite">0 / 0</span>
          <button id="history-next" class="history-button" type="button" title="다음 수" aria-label="다음 수">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 8 6-8 6z"/></svg>
          </button>
          <button id="history-last" class="history-button" type="button" title="마지막 수" aria-label="마지막 수">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M6 6l8 6-8 6z"/></svg>
          </button>
        </div>
      </div>
    </section>
  </main>

  <dialog id="new-game-dialog" class="new-game-dialog" aria-labelledby="new-game-title">
    <form id="new-game-form" class="new-game-form" method="dialog">
      <div class="dialog-header">
        <div>
          <p class="dialog-eyebrow">NEW GAME</p>
          <h2 id="new-game-title">새 게임</h2>
        </div>
        <button id="new-game-close" class="dialog-close" type="button" aria-label="닫기">×</button>
      </div>

      <label class="field">
        <span class="field-label">게임 이름</span>
        <input id="game-name-input" name="gameName" type="text" maxlength="60" placeholder="예: AI 2000 연습" autocomplete="off" required>
      </label>

      <div class="field field-row">
        <div>
          <span class="field-label">AI 상대</span>
          <span class="field-description">끄면 양쪽 기물을 직접 움직입니다.</span>
        </div>
        <label class="switch">
          <input id="ai-enabled-input" name="aiEnabled" type="checkbox" checked>
          <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
        </label>
      </div>

      <div id="rating-field" class="field rating-field">
        <span class="field-label">AI Rating</span>
        <div class="rating-row">
          <select id="rating-select" name="ratingPreset" aria-label="AI Rating 선택">
            <option value="800">800</option>
            <option value="1000">1000</option>
            <option value="1200">1200</option>
            <option value="1400">1400</option>
            <option value="1600">1600</option>
            <option value="1800">1800</option>
            <option value="2000" selected>2000</option>
            <option value="custom">직접 입력</option>
          </select>
          <input id="rating-custom-input" class="rating-custom-input" name="ratingCustom" type="number" min="400" max="3190" step="50" value="2000" inputmode="numeric" aria-label="AI Rating 직접 입력" hidden>
        </div>
      </div>

      <div class="dialog-actions">
        <button id="new-game-cancel" class="dialog-button dialog-button-secondary" type="button">취소</button>
        <button class="dialog-button dialog-button-primary" type="submit">만들기</button>
      </div>
    </form>
  </dialog>

  <script src="./engine-bootstrap.js?v=20261004-maia-extern-wasm-v4"></script>
  <script type="module" src="./app.js?v=20261004-maia-extern-wasm-v4"></script>
  <script type="module" src="./annotations.js?v=20261004-maia-extern-wasm-v4"></script>
  <script type="module" src="./annotation-shape.js?v=20261004-maia-extern-wasm-v4"></script>
</body>
</html>
